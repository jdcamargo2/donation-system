name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  static:
    name: Static and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Static and repository gates
        shell: bash
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only-secret
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DATABASE_ENGINE: sqlite
          KOBO_ENABLED: "False"
        run: |
          set -Eeuo pipefail
          chmod +x deploy/ci/check_repository_hygiene.sh deploy/ci/run_static_checks.sh
          ./deploy/ci/run_static_checks.sh

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## Static and repository checks"
            echo ""
            echo "- Purpose: hygiene, pip check, Django check, makemigrations --check, bash -n"
            echo "- Python: 3.12"
            echo "- Database: not required (sqlite only for import-time settings)"
          } >> "$GITHUB_STEP_SUMMARY"

  postgres-migrations:
    name: PostgreSQL migration and artifact verification
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigedon_ci
          POSTGRES_USER: sigedon_ci
          POSTGRES_PASSWORD: sigedon_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigedon_ci -d sigedon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: sigedon_ci
      POSTGRES_USER: sigedon_ci
      POSTGRES_PASSWORD: sigedon_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      KOBO_ENABLED: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Prepare temp media
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/sigedon-media"
          echo "SIGEDON_MEDIA_ROOT=${RUNNER_TEMP}/sigedon-media" >> "$GITHUB_ENV"

      - name: Migration from zero, deploy check, collectstatic
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deploy/ci/run_migration_gates.sh
          ./deploy/ci/run_migration_gates.sh

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## PostgreSQL migration and artifact verification"
            echo ""
            echo "- Python: 3.12 / PostgreSQL: 16"
            echo "- Gates: migrate from zero, idempotent migrate, check --deploy,"
            echo "  collectstatic + verify_deployment_assets, append-only trigger tests"
            echo "- verify_postgres_security runtime-role success remains a staging gate"
          } >> "$GITHUB_STEP_SUMMARY"

  critical-tests:
    name: Critical PostgreSQL tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigedon_ci
          POSTGRES_USER: sigedon_ci
          POSTGRES_PASSWORD: sigedon_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigedon_ci -d sigedon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: sigedon_ci
      POSTGRES_USER: sigedon_ci
      POSTGRES_PASSWORD: sigedon_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      KOBO_ENABLED: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Prepare temp media
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/sigedon-media"
          echo "SIGEDON_MEDIA_ROOT=${RUNNER_TEMP}/sigedon-media" >> "$GITHUB_ENV"

      - name: Focused critical suite
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deploy/ci/run_critical_tests.sh
          ./deploy/ci/run_critical_tests.sh

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## Critical PostgreSQL tests"
            echo ""
            echo "- Command: ./deploy/ci/run_critical_tests.sh"
            echo "- Python: 3.12 / PostgreSQL: 16"
            echo "- Kobo: KOBO_ENABLED=False (mocked clients in tests)"
          } >> "$GITHUB_STEP_SUMMARY"

  full-suite:
    name: Full PostgreSQL suite
    needs:
      - postgres-migrations
      - critical-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigedon_ci
          POSTGRES_USER: sigedon_ci
          POSTGRES_PASSWORD: sigedon_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigedon_ci -d sigedon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: sigedon_ci
      POSTGRES_USER: sigedon_ci
      POSTGRES_PASSWORD: sigedon_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      KOBO_ENABLED: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Prepare temp media
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/sigedon-media"
          echo "SIGEDON_MEDIA_ROOT=${RUNNER_TEMP}/sigedon-media" >> "$GITHUB_ENV"

      - name: Complete Django suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python manage.py test --noinput

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## Full PostgreSQL suite"
            echo ""
            echo "- Command: python manage.py test --noinput"
            echo "- Python: 3.12 / PostgreSQL: 16"
            echo "- Blocking job; no continue-on-error; no failfast"
          } >> "$GITHUB_STEP_SUMMARY"
