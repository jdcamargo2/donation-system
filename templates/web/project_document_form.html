{% extends "base.html" %}
{% block title %}Agregar documento - SIGEDON{% endblock %}
{% block content %}
<h1 class="h3">Agregar documento</h1>
<p>{{ project.code }} - {{ project.name }}</p>
<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}{{ form.as_p }}
    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-outline-secondary" href="{% url 'project_detail' project.pk %}">Cancelar</a>
</form>
{% endblock %}
